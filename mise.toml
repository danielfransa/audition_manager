[tools]
python = "3.12.13"

[env]
_.python.venv = { path = ".venv", create = true, uv_create_args = ["--seed"] }

[tasks.install]
description = "Install the application and development dependencies"
run = 'python -m pip install -e ".[dev]"'

[tasks.test]
run = "python -m pytest"

[tasks.run]
run = "python -m audition_manager"
